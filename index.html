<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 추천 에이전트</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; }
        form { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; font-size: 15px; }
        button { padding: 10px 16px; font-size: 15px; }
        .msg { margin: 14px 0; padding: 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
        .me { background: #e8f0fe; }
        .bot { background: #f4f4f4; }
        .err { background: #fde8e8; }
        .tool { font-size: 12px; color: #555; background: #fffbe6; border: 1px solid #eadf9a;
                border-radius: 6px; padding: 6px 8px; margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
        .ex button { font-size: 13px; padding: 4px 8px; margin: 6px 6px 0 0; }
    </style>
</head>
<body>
    <h2>🍊 제주 여행 추천 에이전트</h2>
    <p>지역·취향을 말하면 에이전트(Gemini)가 <b>find_spots</b>(관광지 목록)와 <b>get_weather</b>(Open-Meteo 날씨)를 스스로 호출해 추천합니다.</p>
    <form id="f">
        <input id="q" placeholder="예) 이번 주말 서귀포에서 갈 만한 곳 추천해줘" autocomplete="off">
        <button id="go">추천</button>
    </form>
    <div class="ex">
        <button type="button">제주시에서 아이랑 갈 만한 곳</button>
        <button type="button">동쪽에서 오늘 뭐하지?</button>
        <button type="button">비 오면 서쪽에서 어디 가?</button>
    </div>
    <div id="log"></div>

    <script>
        const $ = (id) => document.getElementById(id)
        const add = (cls, text) => {
            const d = document.createElement("div")
            d.className = "msg " + cls
            d.textContent = text
            $("log").prepend(d)
            return d
        }

        document.querySelectorAll(".ex button").forEach(b => b.onclick = () => { $("q").value = b.textContent; $("f").requestSubmit() })

        $("f").onsubmit = async (e) => {
            e.preventDefault()
            const message = $("q").value.trim()
            if (!message) return
            $("go").disabled = true
            const wait = add("bot", "에이전트가 도구를 사용 중…")
            try {
                const r = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ message }),
                })
                const j = await r.json()
                wait.remove()
                const box = add("bot" + (j.error ? " err" : ""), j.error ? "오류: " + j.error : j.answer)
                for (const t of (j.trace || []).reverse()) {
                    const d = document.createElement("div")
                    d.className = "tool"
                    d.textContent = `🔧 ${t.tool}(${JSON.stringify(t.input)})\n→ ` + JSON.stringify(t.output).slice(0, 300)
                    box.after(d)
                }
                add("me", message)
                $("q").value = ""
            } catch (err) {
                wait.textContent = "요청 실패: " + err.message + " (Vercel에 배포된 주소에서 열었는지 확인하세요. 파일로 직접 열면 /api가 없습니다.)"
            }
            $("go").disabled = false
        }
    </script>
</body>
</html>
