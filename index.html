    <style>
        :root { --bg:#f6f8f7; --card:#fff; --line:#dfe5e1; --text:#1c2723; --muted:#68756f; --acc:#e8590c; --acc2:#0c8599; --hl:#fff4e6; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#141917; --card:#1e2522; --line:#2f3a35; --text:#e8eeea; --muted:#9aa8a1; --acc:#ff922b; --acc2:#3bc9db; --hl:#3a2a14; }
        }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:sans-serif; }
        header { padding:28px 16px 18px; text-align:center; background:linear-gradient(135deg, #ff922b22, #3bc9db22); border-bottom:1px solid var(--line); }
        header h1 { margin:0 0 6px; font-size:26px; }
        header p { margin:0; color:var(--muted); font-size:14px; }
        main { max-width:1000px; margin:0 auto; padding:16px; }
        .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
        .tools button { padding:8px 16px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; font-size:14px; cursor:pointer; }
        .tools button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
        .tools input { flex:1 1 200px; padding:9px 14px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; font-size:14px; }
        .wish { background:var(--hl); border:1px solid var(--acc); border-radius:12px; padding:12px 14px; margin-bottom:16px; }
        .wish h2 { margin:0 0 8px; font-size:16px; }
        .wish ul { margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:8px; }
        .wish li { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 6px 4px 12px; font-size:13px; display:flex; align-items:center; gap:6px; }
        .wish li button { border:0; background:none; color:var(--muted); cursor:pointer; font-size:14px; }
        .empty { color:var(--muted); font-size:13px; }
        .count { color:var(--muted); font-size:13px; margin:0 0 10px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
        .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; position:relative; }
        .card.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
        .tag { align-self:flex-start; font-size:12px; padding:2px 9px; border-radius:999px; color:#fff; }
        .tag.식당 { background:var(--acc); }
        .tag.카페 { background:var(--acc2); }
        .card h3 { margin:0; font-size:17px; padding-right:34px; }
        .desc { margin:0; font-size:13px; color:var(--muted); line-height:1.5; }
        .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
        .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--acc2), var(--acc)); }
        .score { font-size:13px; display:flex; justify-content:space-between; }
        .heart { position:absolute; top:10px; right:10px; border:0; background:none; font-size:22px; cursor:pointer; color:var(--muted); line-height:1; }
        .heart.on { color:#e03131; }
        .card a { font-size:13px; color:var(--acc2); text-decoration:none; margin-top:auto; }
        .card a:hover { text-decoration:underline; }
        footer { text-align:center; color:var(--muted); font-size:12px; padding:18px 16px 30px; }
    </style>
</head>

            <ul id="wish"></ul>

        <div class="grid" id="grid"></div>
    </main>

        const $ = (id) => document.getElementById(id)
        const KEY = "nohyeong-selected"
        let cat = "전체"

        // selected: JSON의 값이 기본, 하트를 누르면 브라우저(localStorage)에 저장해서 덮어씀
        const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) } catch (e) { return null } })()
        const selected = new Set(saved || DATA.items.filter(x => x.selected).map(x => x.name))
        const persist = () => { try { localStorage.setItem(KEY, JSON.stringify([...selected])) } catch (e) {} }

        const toggle = (name) => { selected.has(name) ? selected.delete(name) : selected.add(name); persist(); render() }

        const el = (tag, cls, text) => {
            const e = document.createElement(tag)
            if (cls) e.className = cls
            if (text != null) e.textContent = text
            return e
        }

        const render = () => {
            const q = $("q").value.trim().toLowerCase()
            // 카테고리 + 이름 검색 → score 높은 순 (같으면 리뷰 많은 순)
            const list = DATA.items
                .filter(x => (cat === "전체" || x.category === cat) && x.name.toLowerCase().includes(q))
                .sort((a, b) => b.score - a.score || b.reviews - a.reviews)

            $("count").textContent = `${list.length}곳 · 점수 높은 순`
            const grid = $("grid"); grid.innerHTML = ""
            if (!list.length) grid.appendChild(el("p", "empty", "조건에 맞는 곳이 없습니다."))
            for (const x of list) {
                const c = el("div", "card" + (selected.has(x.name) ? " sel" : ""))
                c.appendChild(el("span", "tag " + x.category, x.category))
                c.appendChild(el("h3", null, x.name))
                const h = el("button", "heart" + (selected.has(x.name) ? " on" : ""), selected.has(x.name) ? "♥" : "♡")
                h.title = "가 보고 싶은 곳"
                h.onclick = () => toggle(x.name)
                c.appendChild(h)
                c.appendChild(el("p", "desc", x.description))
                const s = el("div", "score"); s.appendChild(el("span", null, `점수 ${x.score}`)); s.appendChild(el("span", null, `★ ${x.rating}`))
                c.appendChild(s)
                const bar = el("div", "bar"), fill = document.createElement("i"); fill.style.width = x.score + "%"; bar.appendChild(fill)
                c.appendChild(bar)
                if (x.source) { const a = el("a", null, "Google 지도에서 보기 ↗"); a.href = x.source; a.target = "_blank"; a.rel = "noopener"; c.appendChild(a) }
                grid.appendChild(c)
            }

            // 가 보고 싶은 곳 목록 (선택된 항목만, 점수 높은 순)
            const wl = DATA.items.filter(x => selected.has(x.name)).sort((a, b) => b.score - a.score)
            $("wcount").textContent = `(${wl.length})`
            const ul = $("wish"); ul.innerHTML = ""
            if (!wl.length) ul.appendChild(el("li", "empty", "카드의 ♡를 눌러 담아 보세요."))
            for (const x of wl) {
                const li = el("li", null, `${x.name} · ${x.score}`)
                const b = el("button", null, "✕"); b.title = "빼기"; b.onclick = () => toggle(x.name)
                li.appendChild(b); ul.appendChild(li)
            }
        }

        document.querySelectorAll(".tools button").forEach(b => b.onclick = () => {
            cat = b.dataset.cat
            document.querySelectorAll(".tools button").forEach(x => x.classList.toggle("on", x === b))
            render()
        })
        $("q").oninput = render
        $("sub").textContent = `${DATA.region} · ${DATA.topic} · 총 ${DATA.items.length}곳 (Google 평점 기준 점수 = 평점 × 20)`
        $("note").textContent = DATA.note || ""
        render()
    </script>
